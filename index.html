<style>
:root{
  --sole:#F5A623;
  --sole-scuro:#D8860B;
  --sole-chiaro:#FFD98A;
  --panna:#FFF8EE;
  --panna-2:#FDF0DC;
  --carta:#FFFFFF;
  --notte:#16263D;
  --grigio:#6B7B8F;
  --verde:#2E9E6B;
  --verde-chiaro:#E4F4EC;
  --corallo:#E1503C;
  --corallo-chiaro:#FCE9E6;
  --ambra-chiara:#FFF2D9;
  --bordo:#EFE2CE;
  --ombra:0 4px 16px rgba(22,38,61,.07);
  --ombra-alta:0 10px 28px rgba(22,38,61,.12);
  --r:20px;
  --r-s:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--panna);
  color:var(--notte);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--sole-scuro);outline-offset:2px;border-radius:6px}

/* ---------- INTESTAZIONE ---------- */
.intestazione{
  background:linear-gradient(160deg,#F9B942 0%,var(--sole) 55%,#EE9612 100%);
  color:#fff;
  padding:calc(22px + env(safe-area-inset-top)) 20px 26px;
  border-radius:0 0 28px 28px;
  box-shadow:var(--ombra-alta);
  position:relative;
  overflow:hidden;
}
.intestazione::after{
  content:"";position:absolute;right:-46px;top:-52px;
  width:170px;height:170px;border-radius:50%;
  background:rgba(255,255,255,.16);
}
.intestazione .marchio{
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  opacity:.9;margin:0 0 8px;position:relative;
}
.intestazione h1{font-size:24px;line-height:1.25;margin:0;font-weight:800;position:relative;letter-spacing:-.01em}
.intestazione .sotto{margin:8px 0 0;font-size:14px;opacity:.95;position:relative}

/* ---------- CONTENITORE ---------- */
.pagina{padding:18px 16px 8px;max-width:640px;margin:0 auto}
.titolo-sezione{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);margin:22px 4px 10px}
.titolo-sezione:first-child{margin-top:6px}

/* ---------- BANNER PROSSIMA SCADENZA ---------- */
.banner{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--ambra-chiara);border:1.5px solid var(--sole-chiaro);
  border-radius:var(--r);padding:14px 16px;margin-bottom:6px
}
.banner .ico{flex:0 0 auto;color:var(--sole-scuro);margin-top:1px}
.banner .et{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sole-scuro)}
.banner .tx{font-size:15px;font-weight:600;margin-top:2px}
.banner .qd{font-size:13px;color:var(--grigio);margin-top:2px}

/* ---------- GRIGLIA CARD HOME ---------- */
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tessera{
  background:var(--carta);border-radius:var(--r);padding:18px 14px;
  box-shadow:var(--ombra);display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:10px;min-height:126px;justify-content:center;
  transition:transform .16s ease,box-shadow .16s ease;
  border:1px solid var(--bordo)
}
.tessera:active{transform:scale(.97);box-shadow:var(--ombra-alta)}
.tessera .cerchio{
  width:52px;height:52px;border-radius:50%;background:var(--ambra-chiara);
  display:flex;align-items:center;justify-content:center;color:var(--sole-scuro)
}
.tessera.allerta .cerchio{background:var(--corallo-chiaro);color:var(--corallo)}
.tessera .nome{font-weight:700;font-size:15px;line-height:1.25}
.tessera .nota{font-size:12px;color:var(--grigio);line-height:1.3}

/* ---------- SCHEDE GENERICHE ---------- */
.scheda{
  background:var(--carta);border-radius:var(--r);box-shadow:var(--ombra);
  border:1px solid var(--bordo);padding:16px 16px;margin-bottom:12px
}
.scheda h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.scheda .sub{font-size:13px;color:var(--grigio);margin:0 0 12px}
.riga{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--panna-2);font-size:14px}
.riga:first-of-type{border-top:0}
.riga dt{flex:0 0 40%;color:var(--grigio);margin:0;font-size:13px}
.riga dd{margin:0;flex:1;font-weight:600}
dl{margin:0}

/* ---------- TIMELINE ITINERARIO ---------- */
.giorno{
  display:flex;gap:0;background:var(--carta);border-radius:var(--r);
  box-shadow:var(--ombra);border:1px solid var(--bordo);margin-bottom:10px;
  overflow:hidden;width:100%;text-align:left;align-items:stretch
}
.giorno:active{transform:scale(.99)}
.giorno .barra{flex:0 0 6px}
.giorno .g{
  flex:0 0 58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--panna-2);padding:12px 4px;gap:2px
}
.giorno .g .cod{font-weight:800;font-size:16px}
.giorno .g .dt{font-size:11px;color:var(--grigio);text-align:center;line-height:1.2}
.giorno .corpo{flex:1;padding:12px 14px;min-width:0}
.giorno .tratta{font-weight:700;font-size:15px;line-height:1.3}
.giorno .dove{font-size:13px;color:var(--grigio);margin-top:3px}
.giorno .orari{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.giorno.oggi{border:2px solid var(--sole);box-shadow:0 6px 20px rgba(245,166,35,.28)}
.giorno.oggi .g{background:var(--sole);color:#fff}
.giorno.oggi .g .dt{color:rgba(255,255,255,.9)}
.etichetta-oggi{
  display:inline-block;background:var(--sole);color:#fff;font-size:10px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-bottom:6px
}
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:99px;background:var(--panna-2);color:var(--grigio)
}
.pill.rossa{background:var(--corallo-chiaro);color:var(--corallo)}
.pill.verde{background:var(--verde-chiaro);color:var(--verde)}
.pill.ambra{background:var(--ambra-chiara);color:var(--sole-scuro)}

/* ---------- DETTAGLIO GIORNO ---------- */
.indietro{
  display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;
  color:var(--sole-scuro);padding:8px 12px 8px 6px;margin:0 0 6px -6px
}
.elenco-narrativo{margin:0;padding:0;list-style:none}
.elenco-narrativo li{
  position:relative;padding:0 0 0 22px;margin-bottom:12px;font-size:15px;line-height:1.55
}
.elenco-narrativo li::before{
  content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;
  border-radius:50%;background:var(--sole)
}

/* ---------- ALLERTE ---------- */
.allerta-box{
  background:var(--corallo-chiaro);border:1.5px solid #F3B7AD;border-radius:var(--r-s);
  padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.5
}
.allerta-box strong{color:var(--corallo)}
.nota-box{
  background:var(--ambra-chiara);border:1.5px solid var(--sole-chiaro);border-radius:var(--r-s);
  padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.5
}
.ok-box{
  background:var(--verde-chiaro);border:1.5px solid #B4E0C9;border-radius:var(--r-s);
  padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.5
}

/* ---------- BOTTONI ---------- */
.azioni{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{
  flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 14px;border-radius:99px;font-weight:700;font-size:14px;
  text-decoration:none;min-height:46px;transition:transform .14s ease
}
.btn:active{transform:scale(.97)}
.btn-pieno{background:var(--sole);color:#fff;box-shadow:0 4px 12px rgba(245,166,35,.35)}
.btn-vuoto{background:var(--panna-2);color:var(--notte);border:1.5px solid var(--bordo)}
.btn-rosso{background:var(--corallo);color:#fff}

/* ---------- CHECKLIST ---------- */
.categoria{
  background:var(--carta);border-radius:var(--r);box-shadow:var(--ombra);
  border:1px solid var(--bordo);margin-bottom:12px;overflow:hidden
}
.cat-testa{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left}
.cat-testa .nome{flex:1;font-weight:800;font-size:15px}
.cat-testa .conta{font-size:12px;font-weight:700;color:var(--grigio);white-space:nowrap}
.cat-testa .freccia{transition:transform .2s ease;color:var(--grigio);flex:0 0 auto}
.categoria.aperta .cat-testa .freccia{transform:rotate(90deg)}
.avanzamento{height:5px;background:var(--panna-2);border-radius:99px;overflow:hidden;margin:0 16px 12px}
.avanzamento i{display:block;height:100%;background:var(--verde);border-radius:99px;transition:width .3s ease;width:0}
.cat-corpo{display:none;padding:0 16px 8px}
.categoria.aperta .cat-corpo{display:block}
.voce{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:11px 0;border-top:1px solid var(--panna-2);font-size:14.5px;line-height:1.45
}
.casella{
  flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:2px solid var(--bordo);
  background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px;
  transition:background .15s ease,border-color .15s ease
}
.voce.fatta .casella{background:var(--verde);border-color:var(--verde);color:#fff}
.voce.fatta .testo{color:var(--grigio);text-decoration:line-through}
.voce .casella svg{opacity:0;transition:opacity .15s ease}
.voce.fatta .casella svg{opacity:1}

/* ---------- ORARI CRITICI ---------- */
.orario{
  display:flex;gap:14px;background:var(--carta);border-radius:var(--r);
  border:1px solid #F3B7AD;border-left:6px solid var(--corallo);
  box-shadow:var(--ombra);padding:14px 16px;margin-bottom:10px;align-items:flex-start
}
.orario .quando{flex:0 0 74px}
.orario .quando .gg{font-size:12px;color:var(--grigio);font-weight:600}
.orario .quando .oo{font-size:20px;font-weight:800;color:var(--corallo);line-height:1.1}
.orario .cosa{flex:1;font-size:14.5px;font-weight:600;line-height:1.4}
.orario .cosa small{display:block;font-weight:500;color:var(--grigio);margin-top:4px;font-size:12.5px}

/* ---------- CONTATTI ---------- */
.contatto{
  display:flex;align-items:center;gap:13px;background:var(--carta);border-radius:var(--r-s);
  border:1px solid var(--bordo);box-shadow:var(--ombra);padding:13px 15px;margin-bottom:9px;
  text-decoration:none
}
.contatto:active{transform:scale(.99)}
.contatto .cerchio{
  flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--ambra-chiara);
  display:flex;align-items:center;justify-content:center;color:var(--sole-scuro)
}
.contatto.urgenza .cerchio{background:var(--corallo-chiaro);color:var(--corallo)}
.contatto .testi{flex:1;min-width:0}
.contatto .n{font-weight:700;font-size:14.5px}
.contatto .v{font-size:13px;color:var(--grigio);word-break:break-all}

/* ---------- NAVIGAZIONE ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--bordo);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -3px 16px rgba(22,38,61,.07)
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;color:var(--grigio);font-size:10.5px;font-weight:700;border-radius:14px
}
.nav button.attivo{color:var(--sole-scuro)}
.nav button.attivo .bolla{background:var(--ambra-chiara)}
.nav .bolla{
  width:44px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  transition:background .18s ease
}
.pie{text-align:center;font-size:11.5px;color:var(--grigio);padding:22px 20px 10px;line-height:1.6}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:480px){.griglia{grid-template-columns:1fr 1fr 1fr}}
</style>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const telHref = n => 'tel:' + n.replace(/[^\d+]/g,'');
const mappaHref = ind => 'https://maps.google.com/?q=' + encodeURIComponent(ind);

function oggiISO(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function giorniMancanti(){
  const p = n => String(n).padStart(2,'0');
  const o = new Date(); const oggi = new Date(o.getFullYear(), o.getMonth(), o.getDate());
  const [a,m,g] = PARTENZA.split('-').map(Number);
  const part = new Date(a, m-1, g);
  return Math.round((part - oggi) / 86400000);
}
function giornoDiOggi(){ return GIORNI.find(g => g.data === oggiISO()) || null; }

/* ------------------------------------------------------------------
   INTESTAZIONE DINAMICA
   ------------------------------------------------------------------ */
function aggiornaSaluto(){
  const h1 = document.getElementById('saluto');
  const sub = document.getElementById('sotto-saluto');
  const mancano = giorniMancanti();
  const g = giornoDiOggi();

  if (mancano > 0) {
    h1.textContent = mancano === 1
      ? 'Ciao! Manca 1 giorno alla partenza'
      : 'Ciao! Mancano ' + mancano + ' giorni alla partenza';
    sub.textContent = 'Croazia in camper · 10 – 18 agosto 2026';
  } else if (g) {
    h1.textContent = 'Oggi: ' + g.cod + ' — ' + g.tratta;
    sub.textContent = g.gg + ' ' + g.dm + ' · si dorme: ' + g.notte;
  } else if (oggiISO() > RIENTRO) {
    h1.textContent = 'Bentornati!';
    sub.textContent = 'Croazia in camper · 10 – 18 agosto 2026';
  } else {
    h1.textContent = 'Croazia in camper';
    sub.textContent = '10 – 18 agosto 2026';
  }
}

/* ------------------------------------------------------------------
   PROSSIMA SCADENZA
   ------------------------------------------------------------------ */
function prossimaScadenza(){
  const ora = new Date();
  for (const o of ORARI) {
    const [d,t] = o.data.split('T');
    const [a,m,g] = d.split('-').map(Number);
    const [hh,mm] = t.split(':').map(Number);
    if (new Date(a, m-1, g, hh, mm) > ora) return o;
  }
  return null;
}
function bannerScadenza(){
  const p = prossimaScadenza();
  if (!p) return '';
  return '<div class="banner"><span class="ico">' + I.orologio + '</span><div>' +
    '<div class="et">Prossimo appuntamento</div>' +
    '<div class="tx">' + esc(p.cosa) + '</div>' +
    '<div class="qd">' + esc(p.gg) + ' · ore ' + esc(p.ora) + '</div></div></div>';
}

/* ------------------------------------------------------------------

   ------------------------------------------------------------------ */
function vistaGiorno(cod){
  const g = GIORNI.find(x => x.cod === cod);
  if (!g) return vistaItinerario();
  const f = FATICA[g.fatica];
  let html = '<button class="indietro" data-vai="itinerario">' + I.indietro + ' Itinerario</button>';

  html += '<div class="scheda"><h3>' + g.cod + ' · ' + esc(g.gg) + ' ' + esc(g.dm) + '</h3>' +
    '<p class="sub">' + esc(g.tratta) + '</p>' +
    '<span class="pill ' + f.classe + '">' + f.testo + '</span>' +
    '<dl style="margin-top:12px">' +
    '<div class="riga"><dt>Si dorme</dt><dd>' + esc(g.notte) + '</dd></div>' +
    (g.km ? '<div class="riga"><dt>Distanza</dt><dd>' + esc(g.km) + '</dd></div>' : '') +
    (g.partenza ? '<div class="riga"><dt>Si parte</dt><dd' + (g.critica ? ' style="color:var(--corallo)"' : '') + '>' + esc(g.partenza) + '</dd></div>' : '') +
    (g.arrivo ? '<div class="riga"><dt>Si arriva</dt><dd>' + esc(g.arrivo) + '</dd></div>' : '') +
    '</dl></div>';

  if (g.avviso) html += '<div class="allerta-box"><strong>Attenzione all\u2019orario.</strong> ' + esc(g.avviso) + '</div>';

  html += '<div class="titolo-sezione">Com\u2019è fatta la giornata</div><div class="scheda"><ul class="elenco-narrativo">';
  g.dettaglio.forEach(d => { html += '<li>' + esc(d) + '</li>'; });
  html += '</ul></div>';

  const i = GIORNI.indexOf(g);
  html += '<div class="azioni">';
  if (i > 0) html += '<button class="btn btn-vuoto" data-vai="giorno" data-cod="' + GIORNI[i-1].cod + '">' + I.indietro + ' ' + GIORNI[i-1].cod + '</button>';
  if (i < GIORNI.length-1) html += '<button class="btn btn-vuoto" data-vai="giorno" data-cod="' + GIORNI[i+1].cod + '">' + GIORNI[i+1].cod + ' ' + I.freccia + '</button>';
  html += '</div>';
  return html;
}

/* ------------------------------------------------------------------
   VISTA — CHECKLIST
   ------------------------------------------------------------------ */
let aperte = {};

function vistaChecklist(){
  const stato = Memoria.leggi();
  let html = '<div class="titolo-sezione">Cosa portare</div>' +
    '<div class="nota-box">Spunta ogni voce solo quando l\u2019oggetto è davvero nella borsa o nel camper.</div>';

  CHECKLIST.forEach((cat, ci) => {
    const voci = cat.voci.filter(v => typeof v === 'string');
    const fatte = voci.filter((v, k) => {
      const idx = cat.voci.indexOf(v);
      return stato['c' + ci + '-' + idx];
    }).length;
    const perc = voci.length ? Math.round(fatte / voci.length * 100) : 0;
    const apr = aperte[ci] ? ' aperta' : '';

    html += '<section class="categoria' + apr + '" data-cat="' + ci + '">' +
      '<button class="cat-testa" data-piega="' + ci + '" aria-expanded="' + (aperte[ci] ? 'true' : 'false') + '">' +
      '<span class="nome">' + esc(cat.nome) + '</span>' +
      '<span class="conta">' + fatte + '/' + voci.length + '</span>' +
      '<span class="freccia">' + I.freccia + '</span></button>' +
      '<div class="avanzamento"><i style="width:' + perc + '%"></i></div>' +
      '<div class="cat-corpo">';

    cat.voci.forEach((v, vi) => {
      if (typeof v === 'object' && v.titolo) {
        html += '<div class="titolo-sezione" style="margin:14px 0 2px">' + esc(v.titolo) + '</div>';
      } else {
        const id = 'c' + ci + '-' + vi;
        const fatta = stato[id] ? ' fatta' : '';
        html += '<button class="voce' + fatta + '" data-spunta="' + id + '" aria-pressed="' + (stato[id] ? 'true' : 'false') + '">' +
          '<span class="casella">' + I.spuntaPiccola + '</span>' +
          '<span class="testo">' + esc(v) + '</span></button>';
      }
    });
    html += '</div></section>';
  });

  html += '<div class="azioni"><button class="btn btn-vuoto" id="azzera">Azzera tutto</button></div>';

  html += '<div class="titolo-sezione">Ogni sera in campeggio</div>' +
    '<div class="scheda"><p class="sub" style="margin:0 0 10px">Non serve spuntarle: sono le abitudini di ogni sera.</p>' +
    '<ul class="elenco-narrativo">' + OGNI_SERA.map(v => '<li>' + esc(v) + '</li>').join('') + '</ul></div>';

  html += '<p class="pie">' + (Memoria.persistente()
    ? 'Le spunte restano salvate su questo telefono.'
    : 'Le spunte restano finché questa pagina resta aperta.') + '</p>';
  return html;
}

/* ------------------------------------------------------------------
   NAVIGAZIONE E ROUTER
   ------------------------------------------------------------------ */
const VOCI_NAV = [
  { v:'home', nome:'Home', ico:I.home, gruppo:['home'] },
  { v:'itinerario', nome:'Itinerario', ico:I.mappa, gruppo:['itinerario','giorno'] },
  { v:'campeggi', nome:'Campeggi', ico:I.tenda, gruppo:['campeggi'] },
  { v:'checklist', nome:'Checklist', ico:I.spunta, gruppo:['checklist'] },
  { v:'info', nome:'Info', ico:I.info, gruppo:['info','tour','orari','contatti'] }
];

let vistaCorrente = 'home';
let codGiorno = null;

function disegnaNav(){
  document.getElementById('nav').innerHTML = VOCI_NAV.map(n => {
    const attivo = n.gruppo.includes(vistaCorrente) ? ' attivo' : '';
    return '<button class="' + attivo.trim() + '" data-vai="' + n.v + '"' +
      (attivo ? ' aria-current="page"' : '') + '>' +
      '<span class="bolla">' + n.ico + '</span>' + n.nome + '</button>';
  }).join('');
}

function vai(v, cod){
  vistaCorrente = v;
  if (cod) codGiorno = cod;
  const cont = document.getElementById('vista');
  let html = '';
  switch (v) {
    case 'home': html = vistaHome(); break;
    case 'itinerario': html = vistaItinerario(); break;
    case 'giorno': html = vistaGiorno(codGiorno); break;
    case 'campeggi': html = vistaCampeggi(); break;
    case 'tour': html = vistaTour(); break;
    case 'checklist': html = vistaChecklist(); break;
    case 'orari': html = vistaOrari(); break;
    case 'contatti': html = vistaContatti(); break;
    case 'info': html = vistaInfo(); break;
    default: html = vistaHome();
  }
  cont.innerHTML = html;
  disegnaNav();
  window.scrollTo(0, 0);
  cont.focus({preventScroll:true});
}

/* ------------------------------------------------------------------
   EVENTI
   ------------------------------------------------------------------ */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-vai]');
  if (nav) { vai(nav.dataset.vai, nav.dataset.cod); return; }

  const piega = e.target.closest('[data-piega]');
  if (piega) {
    const ci = piega.dataset.piega;
    aperte[ci] = !aperte[ci];
    vai('checklist');
    return;
  }

  const spunta = e.target.closest('[data-spunta]');
  if (spunta) {
    const id = spunta.dataset.spunta;
    const stato = Memoria.leggi();
    stato[id] = !stato[id];
    Memoria.scrivi(stato);
    const sezione = spunta.closest('.categoria');
    const ci = sezione.dataset.cat;
    spunta.classList.toggle('fatta', !!stato[id]);
    spunta.setAttribute('aria-pressed', stato[id] ? 'true' : 'false');
    const voci = CHECKLIST[ci].voci.filter(x => typeof x === 'string').length;
    const fatte = sezione.querySelectorAll('.voce.fatta').length;
    sezione.querySelector('.conta').textContent = fatte + '/' + voci;
    sezione.querySelector('.avanzamento i').style.width = (voci ? Math.round(fatte/voci*100) : 0) + '%';
    return;
  }

  if (e.target.closest('#azzera')) {
    if (window.confirm('Vuoi togliere tutte le spunte della checklist?')) {
      Memoria.azzera();
      vai('checklist');
    }
  }
});

/* ------------------------------------------------------------------
   AVVIO
   ------------------------------------------------------------------ */
aggiornaSaluto();
vai('home');
setInterval(aggiornaSaluto, 60000);
</script>
